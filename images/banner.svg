<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="IPL Match Intelligence: MySQL ball-by-ball analytics 2008–2024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7FAF3"/>
      <stop offset="1" stop-color="#E6F0DD"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#CFDFC3"/>
    </pattern>
    <clipPath id="card"><rect x="1" y="1" width="1278" height="298" rx="18"/></clipPath>
  </defs>

  <!-- card -->
  <rect x="1" y="1" width="1278" height="298" rx="18" fill="url(#bg)" stroke="#D3E2C7" stroke-width="2"/>
  <g clip-path="url(#card)">
    <rect x="840" y="0" width="440" height="300" fill="url(#grid)" opacity="0.7"/>
    <rect x="0" y="0" width="10" height="300" fill="#7FB07A"/>
  </g>

  <!-- pitch with creases and stumps -->
  <g>
    <rect x="880" y="60" width="74" height="196" rx="10" fill="#E9DDBF"/>
    <line x1="880" y1="88" x2="954" y2="88" stroke="#FFFDF7" stroke-width="3"/>
    <line x1="880" y1="228" x2="954" y2="228" stroke="#FFFDF7" stroke-width="3"/>
    <g fill="#B98A5E">
      <rect x="905" y="70" width="4" height="18" rx="2"/><rect x="915" y="70" width="4" height="18" rx="2"/><rect x="925" y="70" width="4" height="18" rx="2"/>
      <rect x="905" y="228" width="4" height="18" rx="2"/><rect x="915" y="228" width="4" height="18" rx="2"/><rect x="925" y="228" width="4" height="18" rx="2"/>
    </g>
    <circle cx="917" cy="160" r="8" fill="#E88A7A"/>
    <path d="M911 155 q6 5 0 10" fill="none" stroke="#FFFDF7" stroke-width="1.5"/>
  </g>

  <!-- win % by powerplay score (batting first, to scale) -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="992" y="62" fill="#4E7A4A" font-size="12" font-weight="700" letter-spacing="1">WIN % BY POWERPLAY RUNS</text>
    <line x1="992" y1="236" x2="1222" y2="236" stroke="#CFDFC3" stroke-width="2"/>
    <rect x="1000" y="168" width="38" height="68" rx="5" fill="#CFE3C4"/>
    <rect x="1054" y="149" width="38" height="87" rx="5" fill="#B5D4A7"/>
    <rect x="1108" y="133" width="38" height="103" rx="5" fill="#93BF86"/>
    <rect x="1162" y="103" width="38" height="133" rx="5" fill="#E88A7A"/>
    <g fill="#4E7A4A" font-size="11" text-anchor="middle">
      <text x="1019" y="252">&lt;40</text><text x="1073" y="252">40-49</text><text x="1127" y="252">50-59</text><text x="1181" y="252">60+</text>
      <text x="1019" y="162" font-weight="700">34%</text><text x="1073" y="143" font-weight="700">44%</text>
      <text x="1127" y="127" font-weight="700">52%</text><text x="1181" y="97" font-weight="700" fill="#B5574A">66%</text>
    </g>
  </g>

  <!-- text -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="64" y="90" fill="#5E8F59" font-size="19" font-weight="600" letter-spacing="3">MYSQL 8  ·  BALL-BY-BALL ANALYTICS  ·  2008 – 2024</text>
    <text x="64" y="148" fill="#24361F" font-size="48" font-weight="700">IPL Match Intelligence</text>
    <text x="64" y="190" fill="#4A5E45" font-size="21">What wins IPL matches, and which players deliver in wins</text>
    <rect x="64" y="218" width="672" height="40" rx="20" fill="#DCEAD2"/>
    <text x="84" y="244" fill="#45663F" font-size="17">1,095 matches  ·  260,920 deliveries  ·  17 seasons  ·  9 SQL scripts</text>
  </g>
</svg>
